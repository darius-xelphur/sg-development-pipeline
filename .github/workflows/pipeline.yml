name: SG Development Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp-key.json

      - name: Run HDB ingestion
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          GCP_PROJECT_ID: sg-development-analytics
        run: python ingestion/hdb/extract_resale.py

      - name: Run staging transformation
        env:
          GCP_PROJECT_ID: sg-development-analytics
        run: python transformations/run_transformation.py staging/stg_hdb_resale.sql
        
      - name: Run mart transformation
        env:
          GCP_PROJECT_ID: sg-development-analytics
        run: python transformations/run_transformation.py mart/mart_hdb_woodlands_town_monthly.sql

      - name: Clean up credentials
        if: always()
        run: rm -f gcp-key.json
